<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>いきものマスター</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🦎 いきものマスター</h1>
    <p>あなたの生き物図鑑をつくろう！</p>
</header>

<main>

    <!-- ホーム -->
    <section id="home" class="page active-page">

        <section class="card">
            <h2>🌱 いきもの探偵</h2>

            <p>EXP：0</p>

            <div class="stats">
                <div class="stat">
                    <span class="stat-number">0</span>
                    <span class="stat-label">発見した種</span>
                </div>

                <div class="stat">
                    <span class="stat-number">0</span>
                    <span class="stat-label">投稿数</span>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>📸 生き物を記録</h2>

            <button>
                ＋ 生き物を記録する
            </button>
        </section>

        <section class="card">
            <h2>📖 マイ図鑑</h2>

            <p>まだ生き物が登録されていません。</p>
        </section>

    </section>


    <!-- 図鑑 -->
    <section id="catalog" class="page">

        <section class="card">
            <h2>📖 マイ図鑑</h2>

            <p>あなたが見つけた生き物がここに並びます。</p>
        </section>

    </section>


    <!-- 記録 -->
    <section id="record" class="page">

        <section class="card">
            <h2>📸 生き物を記録</h2>
    
            <div class="record-form">
    
                <label>
                    写真
                    <input
                        type="file"
                        id="organism-image"
                        accept="image/*"
                    >
                </label>
    
                <div id="image-preview-container">
                    <img id="image-preview" alt="写真プレビュー">
                </div>
    
                <label>
                    生き物の名前
                    <input
                        type="text"
                        id="organism-name"
                        placeholder="例：アブラゼミ"
                    >
                </label>
    
                <label>
                    見つけた場所
                    <input
                        type="text"
                        id="organism-place"
                        placeholder="例：さいたま市"
                    >
                </label>
    
                <label>
                    見つけた日
                    <input
                        type="date"
                        id="organism-date"
                    >
                </label>
    
                <label>
                    メモ
                    <textarea
                        id="organism-note"
                        placeholder="気づいたことなど"
                    ></textarea>
                </label>
    
                <button id="register-button">
                    📖 図鑑に登録する
                </button>
    
            </div>
        </section>
    
    </section>


    <!-- マイページ -->
    <section id="mypage" class="page">

        <section class="card">
            <h2>👤 マイページ</h2>

            <p>いきもの探偵 Lv.1</p>
            <p>EXP：0</p>
        </section>

    </section>

</main>
    
<nav class="bottom-nav">
    <button class="nav-item active" aria-label="ホーム">
        🏠
    </button>

    <button class="nav-item" aria-label="図鑑">
        📖
    </button>

    <button class="nav-item" aria-label="記録">
        📸
    </button>

    <button class="nav-item" aria-label="マイページ">
        👤
    </button>
</nav>

<script src="script.js"></script>
    
</body>
</html>
