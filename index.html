<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>いきものマスター</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🦎 いきものマスター</h1>
    <p>あなたの生き物図鑑をつくろう！</p>
</header>

<main>

    <section class="card">
        <h2>🌱 いきもの探偵</h2>

        <p>EXP：0</p>

        <div class="stats">
            <div class="stat">
                <span class="stat-number">0</span>
                <span class="stat-label">発見した種</span>
            </div>

            <div class="stat">
                <span class="stat-number">0</span>
                <span class="stat-label">投稿数</span>
            </div>
        </div>
    </section>

    <section class="card">
        <h2>📸 生き物を記録</h2>

        <button>
            ＋ 生き物を記録する
        </button>
    </section>

    <section class="card">
        <h2>📖 マイ図鑑</h2>

        <p>まだ生き物が登録されていません。</p>
    </section>

</main>
    
<nav class="bottom-nav">
   <nav class="bottom-nav">

    <button class="nav-item active" aria-label="ホーム">
        🏠
    </button>

    <button class="nav-item" aria-label="図鑑">
        📖
    </button>

    <button class="nav-item" aria-label="記録">
        📸
    </button>

    <button class="nav-item" aria-label="マイページ">
        👤
    
    </button>
</nav>
</body>
</html>
